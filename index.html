<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Life Dashboard</title>
    <meta name="description" content="Manage courses, deadlines, timetable, grades and study time in one place." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply dark mode before the first paint, so dark-mode users don't see a white flash.
      // Same storage key as src/lib/theme.ts.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || ((t === null || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
